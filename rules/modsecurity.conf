# php2shell-guard: ModSecurity v2/v3 (Apache, Nginx connector, OWASP CRS setups).
# Phase 1 runs on headers only, before the body is read or forwarded.
# With CRS, load it before the CRS rules (e.g. REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf).
SecRule REQUEST_METHOD "@streq POST" \
    "id:1026109,phase:1,deny,status:403,log,msg:'php2shell-guard: multipart POST blocked (CVE-2026-109618/109619 mitigation)',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*multipart/form-data(?:[;,\s]|$)"
