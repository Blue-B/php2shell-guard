# php2shell-guard: reject multipart/form-data POST at HAProxy, in the frontend.
# req.fhdr (not req.hdr): req.hdr splits on commas, so "multipart/form-data, boundary=x" would slip past.
# Requests with more than one Content-Type are denied so HAProxy and the backend cannot disagree.
http-request deny deny_status 400 if { req.fhdr_cnt(content-type) gt 1 }
acl p2sg_multipart req.fhdr(content-type) -m reg -i ^\s*multipart/form-data([;,\s]|$)
http-request deny deny_status 403 if METH_POST p2sg_multipart
