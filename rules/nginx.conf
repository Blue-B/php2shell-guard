# php2shell-guard: reject multipart/form-data POST before it reaches PHP-FPM.
# 1) Put the map in the http {} block (e.g. /etc/nginx/conf.d/php2shell-guard.conf):
map "$request_method:$content_type" $p2sg_block {
    default 0;
    "~*^POST:\s*multipart/form-data([;,\s]|$)" 1;
}
# 2) In every server {} that passes to PHP, add:
#        if ($p2sg_block) { return 403; }
#    To keep one upload endpoint (it stays exposed), use a location-level check instead:
#        location = /upload.php { include fastcgi_php.conf; }   # no p2sg check here
# 3) nginx -t && systemctl reload nginx
#
# Not recommended: blocking on PHPSESSID cookies breaks sessions and does not stop multipart bodies.
