; php2shell-guard: PHP's interim settings for CVE-2026-109618 / CVE-2026-109619, until you can patch.
; None of them is a complete fix. Patch PHP.
;
; Set them where they apply before PHP parses the request: php.ini / conf.d, the FPM pool, the Apache vhost.
; FPM/CGI/LSAPI .user.ini and ini_set() apply too late and do NOT help.
; Restart every PHP worker afterwards (restart FPM / Apache), then confirm with check.php through the web server.

; CVE-2026-109619 (stale global state): blocks the confirmed session upload-progress path. PHP 5.4+.
; Worth keeping off after patching too if you have no upload progress bars.
session.upload_progress.enabled = Off

; CVE-2026-109619, PHP 8.5: blocks the confirmed fatal-backtrace path. Older PHP ignores it here.
fatal_error_backtraces = Off

; CVE-2026-109618 (OOM corruption): no PHP memory limit means no predictable out-of-memory to trigger.
; One request can then use all RAM: cap the service instead (systemd MemoryMax= or a container limit).
; Do NOT use ulimit -v / RLIMIT_AS / RLIMIT_DATA: a failed allocation reaches the vulnerable path.
; Apps raise it again with ini_set() (WordPress does), so prefer php_admin_value below.
; Restore your normal limit after patching.
memory_limit = -1

; Keep request bodies small: 8M without uploads, 32M if you need them. Keep upload_max_filesize below it.
post_max_size = 8M

; FPM pool (www.conf), apps cannot override php_admin_*:
;   php_admin_flag[session.upload_progress.enabled] = off
;   php_admin_value[memory_limit] = -1
;   php_admin_value[post_max_size] = 8M
;   php_admin_flag[fatal_error_backtraces] = off      ; PHP 8.5 only
;   pm.max_requests = 1    ; optional: one request per worker breaks the CVE-2026-109619 chain, costs speed
;
; Apache mod_php vhost:
;   php_admin_flag session.upload_progress.enabled off
;   php_admin_value memory_limit -1
;   php_admin_value post_max_size 8M
;   php_admin_flag fatal_error_backtraces off           ; PHP 8.5 only
; Shared hosting with mod_php: .htaccess takes only php_flag / php_value (same names and values).
; A misspelled, invalid or deprecated value in .htaccess or the vhost is itself a CVE-2026-109619
; trigger (warning before request startup): check the error log after adding any, remove stale ones.
;
; Shared hosting on FPM/CGI/LSAPI without php.ini access: nothing in this file works for you.
; Ask the host to patch, and use an edge rule from rules/ if the site needs no multipart forms.
