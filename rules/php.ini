; php2shell-guard: turn off session upload progress if you do not use upload progress bars.
; Targets the reported attack path (session upload-progress during multipart parsing).
; It is NOT a confirmed fix for either CVE. Patch PHP.

; php.ini or conf.d/99-php2shell-guard.ini (PHP 5.4+; does not exist on 5.2/5.3):
session.upload_progress.enabled = Off

; PHP-FPM pool (www.conf), cannot be overridden by the app:
;   php_admin_flag[session.upload_progress.enabled] = off
; Apache mod_php (vhost):
;   php_admin_flag session.upload_progress.enabled off
; Shared hosting without php.ini access (FPM/CGI/LSAPI): put this in a .user.ini in the docroot:
;   session.upload_progress.enabled = 0
;   (picked up after user_ini.cache_ttl, default 300 s)
; Shared hosting with mod_php: in .htaccess:
;   php_flag session.upload_progress.enabled off
;
; Reload PHP-FPM / Apache, then confirm with check.php through the web server.
